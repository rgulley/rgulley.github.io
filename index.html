<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Text from BYX Rush Portal</title>
<style>
  :root{--purple:#4F2D7F;--plum:#371859;--iron:#2C2A26;--gold:#CCDE57}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--plum);color:#fff;
    font:16px/1.5 "Avenir Next","Nunito Sans","Trebuchet MS",system-ui,sans-serif;padding:24px}
  .card{width:min(420px,100%);background:#fff;color:var(--iron);border-radius:16px;padding:22px;border-top:5px solid var(--gold);display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:20px;text-transform:uppercase;letter-spacing:.05em;color:var(--purple)}
  .num{font-size:22px;font-weight:700}
  .msg{background:#F3F2F5;border-radius:10px;padding:10px 12px;white-space:pre-wrap}
  a.btn{display:block;text-align:center;background:var(--purple);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;font-size:17px}
  .small{font-size:13px;color:#6E6B66}
</style>
</head>
<body>
<main class="card">
  <h1 id="title">Opening Messages…</h1>
  <div class="num" id="num"></div>
  <div class="msg" id="msg"></div>
  <a class="btn" id="go" href="#">Open Messages</a>
  <p class="small">If Messages didn't open on its own, tap the button. Then go back to the Rush Portal.</p>
</main>
<script>
(function(){
  // Data rides in the #fragment, which browsers never send to the server.
  var h=new URLSearchParams(location.hash.slice(1));
  var n=(h.get("n")||"").replace(/[^0-9+]/g,"");
  var m=h.get("m")||"";
  var name=h.get("to")||"";
  if(!n){document.getElementById("title").textContent="No number was sent";document.getElementById("go").style.display="none";return;}
  document.getElementById("title").textContent=name?"Text "+name:"Send text";
  document.getElementById("num").textContent=n;
  document.getElementById("msg").textContent=m;
  var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var href="sms:"+n+(m?(ios?"&body=":"?body=")+encodeURIComponent(m):"");
  var go=document.getElementById("go");go.href=href;
  setTimeout(function(){location.href=href;},150);
})();
</script>
</body>
</html>
